services:
  - type: web
    name: fintrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: JWT_SECRET
        generateValue: true
